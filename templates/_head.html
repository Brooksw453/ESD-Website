<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <link rel="canonical" href="{{CANONICAL}}">
    <meta name="robots" content="index, follow, max-image-preview:large">

    <!-- Standalone CSP for blog pages — independent of the SPA's index.html CSP. -->
    <meta http-equiv="Content-Security-Policy" content="{{CSP}}">

    <!-- Open Graph -->
    <meta property="og:type" content="{{OG_TYPE}}">
    <meta property="og:title" content="{{OG_TITLE}}">
    <meta property="og:description" content="{{OG_DESCRIPTION}}">
    <meta property="og:url" content="{{OG_URL}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta property="og:site_name" content="ES Designs">
{{EXTRA_META}}
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{OG_TITLE}}">
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}">
    <meta name="twitter:image" content="{{OG_IMAGE}}">

    <!-- Structured data -->
    <script type="application/ld+json">
{{JSONLD}}
    </script>

    <link rel="icon" type="image/svg+xml" href="/assets/images/brand/favicon.svg">
    <link rel="apple-touch-icon" href="/assets/images/brand/esd-logo.png">
    <meta name="theme-color" content="#1F3D5C">

    <!-- Google Analytics (GA4) — same property as the main site -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1J3K52PMLD"></script>
    <script src="/js/analytics.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/blog.css">
</head>
<body class="blog-shell" data-section="ed">
